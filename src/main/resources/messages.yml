# ─────────────────────────────────────────────────────────────────────────────
#  SiriusFFA — textos
#
#  Acepta MiniMessage (<red>, <gradient:#a:#b>, <hover>, <click>) y los códigos
#  de siempre (&c, &#ff8800) mezclados en la misma línea.
#
#  <prefix> se sustituye por el prefijo de abajo. Ponlo donde lo quieras, o
#  quítalo de una línea si prefieres que salga limpia.
#
#  Los marcadores de cada mensaje (<arena>, <player>, ...) se insertan como texto
#  literal: un jugador no puede colorear ni romper un mensaje con su nombre.
#
#  Los textos van en versalitas (ᴀʙᴄ) y sin tildes. Si escribes uno nuevo a mano,
#  respeta el estilo: todo en minúscula, sin mayúsculas y sin acentos. Lo que el
#  jugador tiene que teclear (los comandos) se queda en ASCII normal, o deja de
#  poder escribirse.
# ─────────────────────────────────────────────────────────────────────────────

