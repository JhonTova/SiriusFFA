# ─────────────────────────────────────────────────────────────────────────────
#  LA BARRA DE ARRIBA (config.yml -> hud.bossbar)
#
#  Una sola barra para todo el evento: la espera, la cuenta atras, la partida y el
#  viaje de vuelta al spawn. Se busca por fase (waiting, starting, ending) y, con la
#  partida en juego, por el id del modo. Borra una linea y esa fase deja de pintarla.
# ─────────────────────────────────────────────────────────────────────────────
bar:
  waiting: '<gray>ᴇsᴘᴇʀᴀɴᴅᴏ ᴊᴜɢᴀᴅᴏʀᴇs <white><players><gray>/<white><min>'
  starting: '<gold>ᴇᴍᴘɪᴇᴢᴀ ᴇɴ <white><seconds>s'
  ending: '<gray>ᴇᴠᴇɴᴛᴏ ᴛᴇʀᴍɪɴᴀᴅᴏ <dark_gray>| <gray>ᴀʟ sᴘᴀᴡɴ ᴇɴ <white><seconds>s'

  juggernaut: '<gray>ᴊᴜɢɢᴇʀɴᴀᴜᴛ <white><juggernaut> <dark_gray>| <gray>ᴇxᴛʀᴀᴄᴄɪᴏɴ ᴇɴ <white><remaining> <dark_gray>| <gray>ᴠɪᴅᴀ <white><hearts>'
  classic: '<gray>ʟɪᴅᴇʀ <white><leader> <dark_gray>| <gray>ǫᴜᴇᴅᴀɴ <white><remaining>'
  gun-game: '<gray>ᴠᴀ ɢᴀɴᴀɴᴅᴏ <white><leader> <dark_gray>| <gray>ɴɪᴠᴇʟ <white><level><gray>/<white><total> <dark_gray>| <gray>ǫᴜᴇᴅᴀɴ <white><remaining>'
  one-in-the-chamber: '<gray>ᴜɴᴀ ꜰʟᴇᴄʜᴀ, ᴜɴᴀ ᴠɪᴅᴀ <dark_gray>| <gray>ᴠɪᴠᴏs <white><alive>'

# ─────────────────────────────────────────────────────────────────────────────
#  MODOS
# ─────────────────────────────────────────────────────────────────────────────
juggernaut:
  # Quien lleva el rol y cuanto le queda. El reloj tambien va en la barra de arriba
  # (bar.juggernaut), asi que aqui solo se avisa de lo que cambia lo que hace la gente.
  new: '<newline><gold><bold>ʀᴏɴᴅᴀ <round> ᴅᴇ <rounds></bold><newline><gray>ᴇʟ ᴊᴜɢɢᴇʀɴᴀᴜᴛ ᴇs <white><player><newline><gray>ᴛɪᴇɴᴇ ǫᴜᴇ sᴏʙʀᴇᴠɪᴠɪʀ <white><time><gray> ᴘᴀʀᴀ ᴇxᴛʀᴀᴇʀsᴇ<newline><gray>sɪ ʟᴏ ᴍᴀᴛᴀɪs, ᴇsᴀ ʀᴏɴᴅᴀ ɴᴏ ʟᴀ ɢᴀɴᴀ ɴᴀᴅɪᴇ<newline>'
